[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-signals"
version = "0.1.0"
description = "AI Control Plane Signals SDK — explicit checkpoint / handoff / tool-span calls for structural and governance signals that never cross the LLM wire"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["llm", "agent", "checkpoint", "handoff", "hitl", "otel", "ai-control-plane"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.0.1"]
adk = ["google-adk"]
langchain = ["langchain-core>=0.2.0"]
crewai = ["crewai>=0.30.0"]

[project.urls]
Repository = "https://github.com/your-org/ai-control-plane-sdk"
Documentation = "https://github.com/your-org/ai-control-plane-sdk/tree/main/packages/acp-signals"
"Bug Tracker" = "https://github.com/your-org/ai-control-plane-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["acp_signals*"]
