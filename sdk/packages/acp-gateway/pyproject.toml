[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-gateway"
version = "0.1.0"
description = "AI Control Plane Gateway SDK — route LLM calls through the M3 Agent Gateway for routing, caching, A/B testing, traffic management, and governance enforcement"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["llm", "agent", "gateway", "routing", "observability", "ai-control-plane"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
all = ["openai>=1.0.0", "anthropic>=0.25.0"]

[project.urls]
Repository = "https://github.com/your-org/ai-control-plane-sdk"
Documentation = "https://github.com/your-org/ai-control-plane-sdk/tree/main/packages/acp-gateway"
"Bug Tracker" = "https://github.com/your-org/ai-control-plane-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["acp_gateway*"]
