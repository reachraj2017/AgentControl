[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-tracing"
version = "0.1.0"
description = "AI Control Plane Tracing SDK — instrument LLM calls with OTLP spans for M1 observability and evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["llm", "tracing", "opentelemetry", "otlp", "observability", "ai-control-plane"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
all = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.urls]
Repository = "https://github.com/your-org/ai-control-plane-sdk"
Documentation = "https://github.com/your-org/ai-control-plane-sdk/tree/main/packages/acp-tracing"
"Bug Tracker" = "https://github.com/your-org/ai-control-plane-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["acp_tracing*"]
