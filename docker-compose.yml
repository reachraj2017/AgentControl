# AI Control Plane — Full stack (all 4 modules)

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infra/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  jaeger-init:
    image: alpine:3.19
    volumes:
      - jaeger_badger_data:/badger/data
      - jaeger_badger_key:/badger/key
    command: ["sh", "-c", "chown -R 10001:0 /badger/data /badger/key && chmod -R g+w /badger/data /badger/key"]
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    environment:
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    ports:
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
    volumes:
      - jaeger_badger_data:/badger/data
      - jaeger_badger_key:/badger/key
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8888"
    volumes:
      - ./infra/otelcol/config.yaml:/etc/otel/config.yaml
    depends_on:
      clickhouse:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  eval-runner:
    build:
      context: ./modules/m1-observability-eval/eval_runner
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-anthropic/claude-haiku-4-5-20251001}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  governance-service:
    build:
      context: ./modules/m2-governance-enforcement/governance_service
    ports:
      - "8002:8002"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  agent-gateway:
    build:
      context: ./modules/m3-agent-gateway/agent_gateway
    ports:
      - "8080:8080"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: https://api.openai.com/v1
      GOVERNANCE_SERVICE_URL: http://governance-service:8002
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-}
      GATEWAY_AUTH_ENABLED: ${GATEWAY_AUTH_ENABLED:-false}
      GATEWAY_CACHE_TTL_SECONDS: ${GATEWAY_CACHE_TTL_SECONDS:-0}
      GATEWAY_SEMANTIC_CACHE_TTL_SECONDS: ${GATEWAY_SEMANTIC_CACHE_TTL_SECONDS:-0}
      GATEWAY_SEMANTIC_CACHE_THRESHOLD: ${GATEWAY_SEMANTIC_CACHE_THRESHOLD:-0.92}
      GATEWAY_SEMANTIC_CACHE_MAX_ENTRIES: ${GATEWAY_SEMANTIC_CACHE_MAX_ENTRIES:-500}
      GATEWAY_EMBED_MODEL: ${GATEWAY_EMBED_MODEL:-text-embedding-3-small}
    depends_on:
      clickhouse:
        condition: service_healthy
      governance-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  eval-agent:
    build:
      context: ./modules/m1-observability-eval/eval_agent
    ports:
      - "8001:8001"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      EVAL_RUNNER_URL: http://eval-runner:8000
      GOVERNANCE_SERVICE_URL: http://governance-service:8002
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-anthropic/claude-sonnet-4-6}
    depends_on:
      clickhouse:
        condition: service_healthy
      eval-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  governance-agent:
    build:
      context: ./modules/m2-governance-enforcement/governance_agent
    ports:
      - "8004:8004"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      GOVERNANCE_SERVICE_URL: http://governance-service:8002
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-anthropic/claude-sonnet-4-6}
    depends_on:
      clickhouse:
        condition: service_healthy
      governance-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  gateway-agent:
    build:
      context: ./modules/m3-agent-gateway/gateway_agent
    ports:
      - "8005:8005"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      GATEWAY_URL: http://agent-gateway:8080
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-anthropic/claude-sonnet-4-6}
    depends_on:
      clickhouse:
        condition: service_healthy
      agent-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8005/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  evalgov-agent:
    build:
      context: ./modules/m4-intelligence/evalgov_agent
    ports:
      - "8003:8003"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      GOVERNANCE_SERVICE_URL: http://governance-service:8002
      GATEWAY_URL: http://agent-gateway:8080
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-anthropic/claude-sonnet-4-6}
      MONITOR_POLL_SECONDS: "60"
      HITL_TIMEOUT_MINUTES: "15"
      EVAL_RUNNER_URL: http://eval-runner:8000
      WATCHER_INTERVAL_SECONDS: "900"
      EVAL_AGENT_URL: http://eval-agent:8001
      GOVERNANCE_AGENT_URL: http://governance-agent:8004
      GATEWAY_AGENT_URL: http://gateway-agent:8005
    depends_on:
      clickhouse:
        condition: service_healthy
      governance-service:
        condition: service_healthy
      eval-agent:
        condition: service_healthy
      governance-agent:
        condition: service_healthy
      gateway-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  portal:
    build:
      context: ./portal
    ports:
      - "8888:8888"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      EVAL_RUNNER_URL: http://eval-runner:8000
      GOVERNANCE_SERVICE_URL: http://governance-service:8002
      EVALGOV_AGENT_URL: http://evalgov-agent:8003
      GATEWAY_URL: http://agent-gateway:8080
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-}
      GATEWAY_AUTH_ENABLED: ${GATEWAY_AUTH_ENABLED:-false}
      M1_ENABLED: "true"
      M2_ENABLED: "true"
      M3_ENABLED: "true"
      M4_ENABLED: "true"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jaeger_badger_data:
  jaeger_badger_key:
